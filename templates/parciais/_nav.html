{% load static %}
<nav class="navbar navbar-dark navbar-expand-lg">

    <a class="navbar-brand" href="{% url 'produto:lista' %}">
        <img src="{% static 'custom/img/katchau_logo.png' %}" alt="Katchau" class="navbar-logo">
    </a>

    <button class="navbar-toggler" type="button"
        data-toggle="collapse"
        data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav ml-auto">

            <li class="nav-item">
                <a class="nav-link" href="{% url 'produto:lista' %}">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="{% url 'produto:carrinho' %}">
                    <i class="fas fa-shopping-cart mr-1"></i>
                    Carrinho
                </a>
            </li>

            {% if request.user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'pedido:lista' %}">
                        <i class="fas fa-box mr-1"></i>
                        Meus Pedidos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'perfil:criar' %}">
                        <i class="fas fa-user mr-1"></i>
                        {{ request.user.first_name|default:request.user.username }}
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'perfil:logout' %}">
                        Sair
                    </a>
                </li>

            {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'perfil:criar' %}">
                        Entrar / Cadastrar
                    </a>
                </li>

            {% endif %}

        </ul>

        <form class="form-inline my-2 my-lg-0 ml-3" method="GET" action="{% url 'produto:busca' %}">
            <div class="input-group">
                <input name="termo"
                    value="{{ request.GET.termo }}"
                    class="form-control"
                    type="search"
                    placeholder="Buscar produtos..."
                    aria-label="Busca">
                <div class="input-group-append">
                    <button class="btn btn-secondary" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </form>

    </div>
</nav>
